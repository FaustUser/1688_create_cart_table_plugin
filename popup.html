<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>1688 → Excel</title>
<style>
body{font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;padding:12px;width:410px;background:#0f0f10;color:#e9e9ea}
h1{font-size:14px;margin:0 0 10px 0;font-weight:700}
.card{border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;background:rgba(255,255,255,.04)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:6px}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 12px;background:#2d6cdf;color:#fff;font-weight:700}
button.secondary{background:rgba(255,255,255,.12)}
button:disabled{opacity:.5;cursor:not-allowed}
.muted{color:rgba(233,233,234,.7);font-size:12px}
.log{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;color:rgba(233,233,234,.85);margin-top:8px}
.ok{color:#7CFC00}
.err{color:#ff6b6b}
.divider{height:10px}
label{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(233,233,234,.8)}
input[type="number"]{width:90px;border-radius:8px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.25);color:#fff;padding:6px 8px}
</style>
</head>
<body>
<h1>1688 → Excel</h1>
<div class="card">
  <div class="col">
    <div class="muted">Авто-режим: раскрываем заказы, скроллим страницу и собираем Excel.</div>
    <div class="divider"></div>
    <div class="row">
      <label>Шаг скролла, px: <input id="step" type="number" value="900"></label>
      <label>Пауза, мс: <input id="wait" type="number" value="650"></label>
      <label>Картинка, px: <input id="img" type="number" value="200"></label>
    </div>
    <div class="row">
      <button id="auto">Авто: раскрыть+скролл+Excel</button>
    </div>
    <div class="divider"></div>
    <div id="log" class="log"></div>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
